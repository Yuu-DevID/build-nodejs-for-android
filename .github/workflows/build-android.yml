name: Build Node.js for Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node.js version tag (e.g. v26.2.0)'
        required: false
        default: 'v26.2.0'
      ndk_version:
        description: 'Android NDK version (e.g. r27c)'
        required: false
        default: 'r27c'
      android_sdk_version:
        description: 'Minimum Android SDK version'
        required: false
        default: '24'

env:
  NODE_VERSION: ${{ github.event.inputs.node_version || 'v26.2.0' }}
  NDK_VERSION: ${{ github.event.inputs.ndk_version || 'r27c' }}
  ANDROID_SDK_VERSION: ${{ github.event.inputs.android_sdk_version || '24' }}

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Job 1: Build libnode.so (shared library for embedding)
  # ═══════════════════════════════════════════════════════════════════════════
  build-libnode:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, arm, x86, x86_64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 build-essential wget unzip

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: android-ndk-${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}-linux

      - name: Download Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          NDK_URL="https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          echo "Downloading NDK ${NDK_VERSION}..."
          wget --progress=bar:force:noscroll -O "android-ndk-${NDK_VERSION}-linux.zip" "$NDK_URL"
          unzip -q "android-ndk-${NDK_VERSION}-linux.zip"
          rm -f "android-ndk-${NDK_VERSION}-linux.zip"

      - name: Clone Node.js source
        run: |
          git clone --depth 1 --branch "${NODE_VERSION}" https://github.com/nodejs/node.git node-src

      - name: Apply Android patches
        working-directory: node-src
        run: |
          # Apply official V8 trap-handler patch if exists
          if [ -f "android-patches/trap-handler.h.patch" ] && [ -f "deps/v8/src/trap-handler/trap-handler.h" ]; then
            echo "Applying V8 trap-handler patch..."
            patch -f ./deps/v8/src/trap-handler/trap-handler.h < ./android-patches/trap-handler.h.patch || true
          fi

          # Apply V8 stack_trace patch for Android Bionic
          if [ -f "../.github/scripts/stack_trace_posix.patch" ] && [ -f "deps/v8/src/base/debug/stack_trace_posix.cc" ]; then
            echo "Applying V8 stack_trace patch..."
            patch -f ./deps/v8/src/base/debug/stack_trace_posix.cc < ../.github/scripts/stack_trace_posix.patch || true
          fi

          # Apply v8config.h patch (allow ARM target on x64 host)
          if [ -f "../.github/scripts/v8config-h.patch" ] && [ -f "deps/v8/include/v8config.h" ]; then
            echo "Applying v8config.h patch..."
            patch -f ./deps/v8/include/v8config.h < ../.github/scripts/v8config-h.patch || true
          fi

      - name: Configure libnode.so for ${{ matrix.arch }}
        working-directory: node-src
        run: |
          NDK_DIR="$(pwd)/../android-ndk-${NDK_VERSION}"

          # Map arch to Node.js values
          case "${{ matrix.arch }}" in
            arm64)   DEST_CPU="arm64"; TOOLCHAIN_PREFIX="aarch64-linux-android"; GYP_ARCH="arm64" ;;
            arm)     DEST_CPU="arm";   TOOLCHAIN_PREFIX="armv7a-linux-androideabi"; GYP_ARCH="arm" ;;
            x86)     DEST_CPU="ia32"; TOOLCHAIN_PREFIX="i686-linux-android"; GYP_ARCH="ia32" ;;
            x86_64)  DEST_CPU="x64";  TOOLCHAIN_PREFIX="x86_64-linux-android"; GYP_ARCH="x64" ;;
          esac

          TOOLCHAIN_PATH="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64"

          export PATH="${TOOLCHAIN_PATH}/bin:$PATH"
          export CC="${TOOLCHAIN_PATH}/bin/${TOOLCHAIN_PREFIX}${ANDROID_SDK_VERSION}-clang"
          export CXX="${TOOLCHAIN_PATH}/bin/${TOOLCHAIN_PREFIX}${ANDROID_SDK_VERSION}-clang++"
          export CC_host=gcc
          export CXX_host=g++

          export GYP_DEFINES="target_arch=${GYP_ARCH} v8_target_arch=${GYP_ARCH} android_target_arch=${GYP_ARCH} host_os=linux OS=android android_ndk_path=${NDK_DIR}"

          echo "Configuring libnode.so: arch=${{ matrix.arch }}, dest-cpu=${DEST_CPU}, shared=yes"

          ./configure \
            --dest-cpu="${DEST_CPU}" \
            --dest-os=android \
            --cross-compiling \
            --shared \
            --openssl-no-asm

      - name: Build libnode.so
        working-directory: node-src
        run: make -j$(nproc)

      - name: Collect artifacts
        working-directory: node-src
        run: |
          OUT_DIR="$(pwd)/../output/libnode-${NODE_VERSION#v}-android-${{ matrix.arch }}"
          mkdir -p "$OUT_DIR/lib" "$OUT_DIR/include/node" "$OUT_DIR/npm"

          # ── libnode.so ──
          echo "=== Collecting libnode.so ==="
          find out/Release -name "libnode.so" -exec cp -v {} "$OUT_DIR/lib/" \; 2>/dev/null || \
          find out/ -name "libnode.so" -exec cp -v {} "$OUT_DIR/lib/" \; 2>/dev/null || \
          echo "WARNING: libnode.so not found!"

          # Also copy libc++_shared.so if present
          NDK_DIR="$(pwd)/../android-ndk-${NDK_VERSION}"
          case "${{ matrix.arch }}" in
            arm64)  SYSROOT_LIB="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android" ;;
            arm)    SYSROOT_LIB="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi" ;;
            x86)    SYSROOT_LIB="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/i686-linux-android" ;;
            x86_64) SYSROOT_LIB="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android" ;;
          esac
          if [ -f "${SYSROOT_LIB}/libc++_shared.so" ]; then
            cp -v "${SYSROOT_LIB}/libc++_shared.so" "$OUT_DIR/lib/"
          fi

          # ── Headers ──
          echo "=== Collecting headers ==="
          for header in \
            src/node.h src/node_version.h src/node_api.h \
            src/node_api_types.h src/js_native_api.h \
            src/js_native_api_types.h src/node_buffer.h \
            src/node_object_wrap.h src/node_version.h; do
            [ -f "$header" ] && cp -v "$header" "$OUT_DIR/include/node/"
          done

          # deps headers
          for dep in uv llhttp http_parser cares nghttp2 openssl zlib; do
            if [ -d "deps/$dep/include" ]; then
              cp -r "deps/$dep/include"/* "$OUT_DIR/include/node/" 2>/dev/null || true
            fi
          done

          # ── npm bundle (JS only, usable with separate node binary) ──
          echo "=== Bundling npm ==="
          if [ -d "deps/npm" ]; then
            tar czf "$OUT_DIR/npm/npm-bundle.tar.gz" -C deps npm/
            echo "npm bundled: $(du -sh "$OUT_DIR/npm/npm-bundle.tar.gz" | cut -f1)"
          fi

          # Also copy corepack if available
          if [ -d "deps/corepack" ]; then
            tar czf "$OUT_DIR/npm/corepack-bundle.tar.gz" -C deps corepack/
          fi

          echo "=== Output ==="
          ls -lhR "$OUT_DIR/"

      - name: Upload libnode.so
        uses: actions/upload-artifact@v4
        with:
          name: libnode-${{ matrix.arch }}-${{ env.NODE_VERSION }}
          path: output/libnode-${{ env.NODE_VERSION }}-android-${{ matrix.arch }}/lib/
          retention-days: 90

      - name: Upload headers
        uses: actions/upload-artifact@v4
        with:
          name: node-headers-${{ matrix.arch }}-${{ env.NODE_VERSION }}
          path: output/libnode-${{ env.NODE_VERSION }}-android-${{ matrix.arch }}/include/
          retention-days: 90

      - name: Upload npm bundle
        uses: actions/upload-artifact@v4
        with:
          name: npm-bundle-${{ matrix.arch }}-${{ env.NODE_VERSION }}
          path: output/libnode-${{ env.NODE_VERSION }}-android-${{ matrix.arch }}/npm/
          retention-days: 90

      - name: Upload full package
        uses: actions/upload-artifact@v4
        with:
          name: libnode-android-${{ matrix.arch }}-${{ env.NODE_VERSION }}
          path: output/libnode-${{ env.NODE_VERSION }}-android-${{ matrix.arch }}/
          retention-days: 90

  # ═══════════════════════════════════════════════════════════════════════════
  # Job 2: Build full node binary + npm (for running on Android device)
  # ═══════════════════════════════════════════════════════════════════════════
  build-node:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, arm, x86, x86_64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 build-essential wget unzip

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: android-ndk-${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}-linux

      - name: Download Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          NDK_URL="https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          wget --progress=bar:force:noscroll -O "android-ndk-${NDK_VERSION}-linux.zip" "$NDK_URL"
          unzip -q "android-ndk-${NDK_VERSION}-linux.zip"
          rm -f "android-ndk-${NDK_VERSION}-linux.zip"

      - name: Clone Node.js source
        run: |
          git clone --depth 1 --branch "${NODE_VERSION}" https://github.com/nodejs/node.git node-src

      - name: Apply Android patches
        working-directory: node-src
        run: |
          if [ -f "android-patches/trap-handler.h.patch" ] && [ -f "deps/v8/src/trap-handler/trap-handler.h" ]; then
            patch -f ./deps/v8/src/trap-handler/trap-handler.h < ./android-patches/trap-handler.h.patch || true
          fi
          if [ -f "../.github/scripts/stack_trace_posix.patch" ] && [ -f "deps/v8/src/base/debug/stack_trace_posix.cc" ]; then
            patch -f ./deps/v8/src/base/debug/stack_trace_posix.cc < ../.github/scripts/stack_trace_posix.patch || true
          fi

      - name: Configure node binary for ${{ matrix.arch }}
        working-directory: node-src
        run: |
          NDK_DIR="$(pwd)/../android-ndk-${NDK_VERSION}"
          export CC_host=gcc
          export CXX_host=g++

          echo "Configuring node binary: arch=${{ matrix.arch }}"
          ./android-configure "$NDK_DIR" "$ANDROID_SDK_VERSION" "${{ matrix.arch }}"

      - name: Build node binary
        working-directory: node-src
        run: make -j$(nproc)

      - name: Install and package
        working-directory: node-src
        run: |
          OUTPUT_DIR="$(pwd)/../output/nodejs-${NODE_VERSION#v}-android-${{ matrix.arch }}"
          mkdir -p "$OUTPUT_DIR"
          make DESTDIR="$OUTPUT_DIR" PREFIX="" install

          # Copy npm from deps if not installed
          if [ ! -d "$OUTPUT_DIR/lib/node_modules/npm" ] && [ -d "deps/npm" ]; then
            mkdir -p "$OUTPUT_DIR/lib/node_modules"
            cp -r deps/npm "$OUTPUT_DIR/lib/node_modules/"
          fi

          # Copy corepack
          if [ -d "deps/corepack" ]; then
            mkdir -p "$OUTPUT_DIR/lib/node_modules"
            cp -r deps/corepack "$OUTPUT_DIR/lib/node_modules/" 2>/dev/null || true
          fi

      - name: Setup Android wrappers
        run: |
          SRC_DIR="output/nodejs-${NODE_VERSION#v}-android-${{ matrix.arch }}"
          PKG_DIR="output/nodejs-android-${{ matrix.arch }}"
          mkdir -p "$PKG_DIR/bin" "$PKG_DIR/lib"

          cp -r "$SRC_DIR/bin"/* "$PKG_DIR/bin/"
          cp -r "$SRC_DIR/lib"/* "$PKG_DIR/lib/"

          # Android wrapper scripts
          cp .github/scripts/npm-android.sh "$PKG_DIR/bin/npm-android"
          cp .github/scripts/npx-android.sh "$PKG_DIR/bin/npx-android"
          cp .github/scripts/install-android.sh "$PKG_DIR/install.sh"
          chmod +x "$PKG_DIR/bin/npm-android" "$PKG_DIR/bin/npx-android" "$PKG_DIR/install.sh"

          # README
          cat > "$PKG_DIR/README.txt" << 'READEOF'
Node.js for Android
====================

Installation via ADB:
  adb push . /data/local/tmp/nodejs/
  adb shell chmod 755 /data/local/tmp/nodejs/bin/*

Running Node.js:
  adb shell
  export HOME=/data/local/tmp
  export LD_LIBRARY_PATH=/data/local/tmp/nodejs/bin:$LD_LIBRARY_PATH
  /data/local/tmp/nodejs/bin/node --version

Running npm:
  /data/local/tmp/nodejs/bin/npm-android install <package>
READEOF

          echo "=== Package ready ==="
          ls -lh "$PKG_DIR/bin/"

      - name: Upload node binary
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-android-${{ matrix.arch }}-${{ env.NODE_VERSION }}
          path: output/nodejs-android-${{ matrix.arch }}/
          retention-days: 90

  # ═══════════════════════════════════════════════════════════════════════════
  # Job 3: Create GitHub Release on tag push
  # ═══════════════════════════════════════════════════════════════════════════
  release:
    needs: [build-libnode, build-node]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Package releases
        run: |
          mkdir -p release
          cd artifacts

          # Package libnode bundles
          for dir in libnode-android-*; do
            [ -d "$dir" ] || continue
            arch=$(echo "$dir" | sed 's/libnode-android-//;s/-v.*//')
            tar czf "../release/libnode-android-${arch}-${NODE_VERSION}.tar.gz" -C "$dir" .
          done

          # Package node binary bundles
          for dir in nodejs-android-*; do
            [ -d "$dir" ] || continue
            [[ "$dir" == libnode-* ]] && continue
            arch=$(echo "$dir" | sed 's/nodejs-android-//;s/-v.*//')
            tar czf "../release/nodejs-android-${arch}-${NODE_VERSION}.tar.gz" -C "$dir" .
          done

          # Combined archive
          tar czf "../release/nodejs-android-all-${NODE_VERSION}.tar.gz" .

          echo "=== Release files ==="
          ls -lh ../release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.tar.gz
          generate_release_notes: true
