name: Build Node.js for Android

on:
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node.js version tag (e.g. v26.2.0)'
        required: false
        default: 'v26.2.0'
      ndk_version:
        description: 'Android NDK version (e.g. r29b)'
        required: false
        default: 'r29b'
      android_sdk_version:
        description: 'Minimum Android SDK version'
        required: false
        default: '24'

env:
  NODE_VERSION: ${{ github.event.inputs.node_version || 'v26.2.0' }}
  NDK_VERSION:  ${{ github.event.inputs.ndk_version  || 'r29b' }}
  ANDROID_SDK:  ${{ github.event.inputs.android_sdk_version || '24' }}

# ─── Job 1: Download + cache NDK once, shared across arch jobs ───────────────
jobs:
  prepare-ndk:
    runs-on: ubuntu-latest
    outputs:
      ndk-cache-key: ${{ steps.ndk-key.outputs.key }}
    steps:
      - name: Compute cache key
        id: ndk-key
        run: echo "key=ndk-${{ env.NDK_VERSION }}-linux-v1" >> "$GITHUB_OUTPUT"

      - name: Restore NDK cache
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/android-ndk-${{ env.NDK_VERSION }}
          key: ${{ steps.ndk-key.outputs.key }}

      - name: Install unzip
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: sudo apt-get install -y --no-install-recommends unzip

      - name: Download & extract NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          URL="https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          echo "::group::Download NDK ${NDK_VERSION}"
          wget --progress=bar:force:noscroll -O ndk.zip "$URL"
          echo "::endgroup::"
          echo "::group::Extract NDK"
          unzip -q ndk.zip
          rm -f ndk.zip
          echo "::endgroup::"
          echo "NDK ready: $(du -sh android-ndk-${NDK_VERSION})"

  # ─── Job 2: Clone + patch Node.js source, cache by version ────────────────
  prepare-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Node.js source cache
        id: cache-src
        uses: actions/cache@v4
        with:
          path: node-src
          key: node-src-${{ env.NODE_VERSION }}-v4

      - name: Clone Node.js ${{ env.NODE_VERSION }}
        if: steps.cache-src.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${NODE_VERSION}" \
            https://github.com/nodejs/node.git node-src
          echo "Cloned: $(du -sh node-src)"

      - name: Apply Android patches
        if: steps.cache-src.outputs.cache-hit != 'true'
        working-directory: node-src
        run: |
          set -euo pipefail
          PATCH_DIR="../.github/scripts"

          # V8 stack_trace patch — fixes backtrace on Android Bionic
          if [ -f "$PATCH_DIR/stack_trace_posix.patch" ] && \
             [ -f "deps/v8/src/base/debug/stack_trace_posix.cc" ]; then
            echo "Applying stack_trace_posix.patch..."
            patch -p1 < "$PATCH_DIR/stack_trace_posix.patch"
          fi

          # V8 trap-handler patch (optional, skip if missing)
          if [ -f "android-patches/trap-handler.h.patch" ] && \
             [ -f "deps/v8/src/trap-handler/trap-handler.h" ]; then
            echo "Applying trap-handler.h.patch..."
            patch -f deps/v8/src/trap-handler/trap-handler.h \
              < android-patches/trap-handler.h.patch || true
          fi

          # v8config.h patch — allow ARM target on x64 host
          if [ -f "$PATCH_DIR/v8config-h.patch" ] && \
             [ -f "deps/v8/include/v8config.h" ]; then
            echo "Applying v8config-h.patch..."
            patch -p1 < "$PATCH_DIR/v8config-h.patch"
          fi

          # globals.h patch — fix TAGGED_SIZE_8_BYTES for cross-compilation
          if [ -f "$PATCH_DIR/globals-h.patch" ] && \
             [ -f "deps/v8/src/common/globals.h" ]; then
            echo "Applying globals-h.patch..."
            patch -p1 < "$PATCH_DIR/globals-h.patch"
          fi

  # ─── Job 3: Build per arch ─────────────────────────────────────────────────
  build:
    needs: [prepare-ndk, prepare-source]
    runs-on: ubuntu-latest
    timeout-minutes: 120   # 2 h — reasonable upper bound with ccache
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, arm]

    steps:
      - uses: actions/checkout@v4

      # ── Restore pre-patched source ──────────────────────────────────────────
      - name: Restore Node.js source cache
        uses: actions/cache@v4
        with:
          path: node-src
          key: node-src-${{ env.NODE_VERSION }}-v4

      # ── Restore NDK ─────────────────────────────────────────────────────────
      - name: Restore NDK cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/android-ndk-${{ env.NDK_VERSION }}
          key: ${{ needs.prepare-ndk.outputs.ndk-cache-key }}

      # ── ccache — the biggest win ─────────────────────────────────────────────
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: node-${{ env.NODE_VERSION }}-android-${{ matrix.arch }}
          restore-keys: |
            node-${{ env.NODE_VERSION }}-android-${{ matrix.arch }}
            node-android-${{ matrix.arch }}
          max-size: 3G
          append-timestamp: false

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pip build-essential ccache

      # ── Configure ───────────────────────────────────────────────────────────
      - name: Configure Node.js for Android ${{ matrix.arch }}
        working-directory: node-src
        env:
          CFLAGS:   "-O2 -fstack-protector-strong"
          CXXFLAGS: "-O2 -fstack-protector-strong"
          LDFLAGS:  "-Wl,--as-needed"
          # Route host compilers through ccache
          CC_host:  "ccache gcc"
          CXX_host: "ccache g++"
        run: |
          set -euo pipefail
          NDK_DIR="${GITHUB_WORKSPACE}/android-ndk-${NDK_VERSION}"
          echo "NDK: $NDK_DIR | SDK: $ANDROID_SDK | arch: ${{ matrix.arch }}"
          ./android-configure "$NDK_DIR" "$ANDROID_SDK" "${{ matrix.arch }}"

      # ── Compile ─────────────────────────────────────────────────────────────
      - name: Build Node.js
        working-directory: node-src
        run: |
          set -euo pipefail
          JOBS=$(nproc)
          echo "Building with $JOBS parallel jobs + ccache..."
          ccache -z   # reset stats before build
          make -j"$JOBS" V=0   # V=0 = quiet output, faster terminal I/O
          ccache -s   # print hit/miss stats

      # ── Install ─────────────────────────────────────────────────────────────
      - name: Install to staging dir
        working-directory: node-src
        run: |
          set -euo pipefail
          STAGE="${GITHUB_WORKSPACE}/stage/nodejs-android-${{ matrix.arch }}"
          mkdir -p "$STAGE"
          make DESTDIR="$STAGE" PREFIX="" install

          # Ensure npm module exists (fallback from deps/)
          if [ ! -d "$STAGE/lib/node_modules/npm" ] && [ -d "deps/npm" ]; then
            mkdir -p "$STAGE/lib/node_modules"
            cp -r deps/npm "$STAGE/lib/node_modules/"
          fi

          # Copy corepack if present
          if [ -d "deps/corepack" ]; then
            mkdir -p "$STAGE/lib/node_modules"
            cp -r deps/corepack "$STAGE/lib/node_modules/" 2>/dev/null || true
          fi

          # Copy libc++_shared.so next to binary for easy LD_LIBRARY_PATH usage
          LIBCXX=$(find "${GITHUB_WORKSPACE}/android-ndk-${NDK_VERSION}" \
            -name "libc++_shared.so" | grep -E "/${{ matrix.arch == 'arm64' && 'aarch64' || 'arm' }}-linux-android/" | head -1)
          if [ -n "$LIBCXX" ]; then
            cp "$LIBCXX" "$STAGE/bin/"
            echo "Copied libc++_shared.so from NDK"
          fi

          echo "--- Installed binaries ---"
          ls -lh "$STAGE/bin/"

      # ── Package ─────────────────────────────────────────────────────────────
      - name: Package artifact
        run: |
          set -euo pipefail
          STAGE="${GITHUB_WORKSPACE}/stage/nodejs-android-${{ matrix.arch }}"
          PKG="${GITHUB_WORKSPACE}/pkg/nodejs-android-${{ matrix.arch }}"
          mkdir -p "$PKG/bin" "$PKG/lib"

          cp -r "$STAGE/bin"/. "$PKG/bin/"
          cp -r "$STAGE/lib"/. "$PKG/lib/"

          # Android wrapper scripts
          cp .github/scripts/npm-android.sh  "$PKG/bin/npm"
          cp .github/scripts/npx-android.sh  "$PKG/bin/npx"
          chmod 755 "$PKG/bin/npm" "$PKG/bin/npx"

          # Install helper
          cp .github/scripts/install-android.sh "$PKG/install.sh"
          chmod 755 "$PKG/install.sh"

          # README
          cat > "$PKG/README.txt" <<EOF
          Node.js ${NODE_VERSION} for Android (${{ matrix.arch }})
          =============================================

          Quick install via ADB:
            adb push . /data/local/tmp/nodejs/
            adb shell sh /data/local/tmp/nodejs/install.sh

          Manual install:
            adb shell
            export HOME=/data/local/tmp
            export LD_LIBRARY_PATH=/data/local/tmp/nodejs/bin:\$LD_LIBRARY_PATH
            /data/local/tmp/nodejs/bin/node --version

          npm/npx usage:
            /data/local/tmp/nodejs/bin/npm install <package>
            /data/local/tmp/nodejs/bin/npx <tool>
          EOF

          echo "--- Package contents ---"
          ls -lh "$PKG/bin/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-android-${{ matrix.arch }}
          path: pkg/nodejs-android-${{ matrix.arch }}/
          retention-days: 90
          compression-level: 6
