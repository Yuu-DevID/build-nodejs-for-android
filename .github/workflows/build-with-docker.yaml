name: Build Node.js for Android With Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      node_version:
        description: "Node.js version"
        required: true
        default: "26.2.0"
      architectures:
        description: "Architectures (arm64,arm,x86,x86_64)"
        required: true
        default: "arm64,arm,x86_64"
      android_sdk_ver:
        description: "Android API level (min 24)"
        required: true
        default: "24"

env:
  # NDK pre-installed di GitHub Actions Ubuntu 22.04:
  #   27.3.13750724 (default), 28.2.13676358, 29.0.14206865
  NDK_PATH: /usr/local/lib/android/sdk/ndk/29.0.14206865
  DEFAULT_NODE_VERSION: "26.2.0"

jobs:
  # ─────────────────────────────────────────────
  # Prepare matrix
  # ─────────────────────────────────────────────
  prepare:
    name: Prepare Build Matrix
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      node_version: ${{ steps.set-matrix.outputs.node_version }}
      android_sdk_ver: ${{ steps.set-matrix.outputs.android_sdk_ver }}
    steps:
      - name: Set matrix
        id: set-matrix
        run: |
          NODE_VERSION="${{ github.event.inputs.node_version || env.DEFAULT_NODE_VERSION }}"
          ARCHS="${{ github.event.inputs.architectures || 'arm64,arm,x86_64' }}"
          SDK_VER="${{ github.event.inputs.android_sdk_ver || '24' }}"

          MATRIX_JSON='{"include":['
          FIRST=true
          IFS=',' read -ra ARCH_LIST <<< "$ARCHS"
          for ARCH in "${ARCH_LIST[@]}"; do
            ARCH=$(echo "$ARCH" | xargs)
            case "$ARCH" in
              arm64|arm|x86|x86_64) ;;
              x64) ARCH="x86_64" ;;
              aarch64) ARCH="arm64" ;;
              *)
                echo "Unknown arch: $ARCH — skip"
                continue
                ;;
            esac
            [[ "$FIRST" == "true" ]] && FIRST=false || MATRIX_JSON+=','
            MATRIX_JSON+="{\"arch\":\"$ARCH\"}"
          done
          MATRIX_JSON+=']}'

          echo "matrix=$MATRIX_JSON"       >> "$GITHUB_OUTPUT"
          echo "node_version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          echo "android_sdk_ver=$SDK_VER"  >> "$GITHUB_OUTPUT"
          echo "Matrix: $MATRIX_JSON"

  # ─────────────────────────────────────────────
  # Build (per arch)
  # ─────────────────────────────────────────────
  build:
    name: Build Node.js ${{ needs.prepare.outputs.node_version }} [${{ matrix.arch }}]
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NDK sudah pre-installed — tidak perlu download
      - name: Verify NDK
        run: |
          echo "NDK path: ${{ env.NDK_PATH }}"
          ls "${{ env.NDK_PATH }}/toolchains/llvm/prebuilt/linux-x86_64/bin/" | grep "clang$" | head -5
          echo "Available NDK versions:"
          ls /usr/local/lib/android/sdk/ndk/

      # Cache Node.js source tarball
      - name: Cache Node.js source
        id: cache-node-src
        uses: actions/cache@v4
        with:
          path: /tmp/node-src-cache
          key: nodejs-src-${{ needs.prepare.outputs.node_version }}

      - name: Download Node.js source
        if: steps.cache-node-src.outputs.cache-hit != 'true'
        run: |
          NODE_VERSION="${{ needs.prepare.outputs.node_version }}"
          mkdir -p /tmp/node-src-cache
          curl -fL --retry 3 \
            -o "/tmp/node-src-cache/node-v${NODE_VERSION}.tar.gz" \
            "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}.tar.gz"

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pip gcc g++ make curl git patch

      - name: Build Node.js [${{ matrix.arch }}]
        env:
          NODE_VERSION: ${{ needs.prepare.outputs.node_version }}
          NDK: ${{ env.NDK_PATH }}
          ANDROID_SDK_VER: ${{ needs.prepare.outputs.android_sdk_ver }}
          ARCH: ${{ matrix.arch }}
          DIST_DIR: ${{ github.workspace }}/output
          WORKDIR: /tmp/node-build
          JOBS: "4"
        run: |
          mkdir -p /tmp/node-build
          cp "/tmp/node-src-cache/node-v${NODE_VERSION}.tar.gz" /tmp/node-build/
          chmod +x node-build.sh
          bash node-build.sh

      - name: Upload artifact [${{ matrix.arch }}]
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-${{ needs.prepare.outputs.node_version }}-android-${{ matrix.arch }}
          path: output/node-v${{ needs.prepare.outputs.node_version }}-android-${{ matrix.arch }}.tar.gz
          retention-days: 30
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # Release (hanya saat push tag v*)
  # ─────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Node.js ${{ needs.prepare.outputs.node_version }} for Android"
          body: |
            ## Node.js ${{ needs.prepare.outputs.node_version }} — Android Binaries

            Built with NDK 29.0.14206865, API level ${{ needs.prepare.outputs.android_sdk_ver }}.

            | File | Architecture |
            |------|-------------|
            | `node-v${{ needs.prepare.outputs.node_version }}-android-arm64.tar.gz`  | arm64-v8a   |
            | `node-v${{ needs.prepare.outputs.node_version }}-android-arm.tar.gz`    | armeabi-v7a |
            | `node-v${{ needs.prepare.outputs.node_version }}-android-x86_64.tar.gz` | x86_64      |

            ### Isi setiap archive
            - `lib/libnode.so` — shared library (stripped)
            - `include/` — Node.js + V8 headers
          files: release-assets/*.tar.gz
          draft: false
          prerelease: false
